# docker-compose.yml
version: '3.8'
services:
  db:
    image: postgres:15  
    restart: always
    environment:
      POSTGRES_DB: todolist_db
      POSTGRES_USER: todolist_user
      POSTGRES_PASSWORD: your_secure_password  
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: